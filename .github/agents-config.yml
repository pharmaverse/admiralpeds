# Package-specific context for AI coding assistants (AGENTS.md generation).
#
# Intended to be consumed by the `sync-admiralci-agents.yml` workflow / the
# `pharmaverse/admiralci` create-agents-md pipeline, alongside the shared
# {admiraldev} programming strategy, git usage, R CMD check, and unit test
# guidance that every admiral-family package receives. Rendering this file
# into AGENTS.md is tracked in pharmaverse/admiralci#246.
#
# This file captures what is unique to {admiralpeds} so an agent understands
# the therapeutic scope, the sibling packages it interoperates with, and the
# CDISC/regulatory references that govern its derivations, without having to
# infer any of that from the R source alone.

package_name: admiralpeds

therapeutic_area: >
  Pediatrics — cross-therapeutic support for pediatric clinical trials, with
  initial scope focused on anthropometric / growth indicators (height,
  weight, BMI, head circumference).

package_purpose: >
  Extension package to {admiral} providing reusable functions and utilities
  for building pediatrics-specific ADaM datasets, following the same
  modular, function-per-derivation design as {admiral} itself. It does not
  duplicate general-purpose {admiral} derivations — it adds what is specific
  to pediatric analyses: growth-standard z-scores/percentiles and
  interpolation of CDC growth-chart reference rows.

implemented_functions:
  - name: derive_params_growth_age()
    purpose: Z-score/percentile-for-age parameters (height, weight, BMI,
      head circumference) from a growth-standard reference table.
  - name: derive_params_growth_height()
    purpose: Z-score/percentile parameters for weight by height/length.
  - name: derive_interp_records()
    purpose: Linear interpolation (by age in days) of CDC growth-chart
      reference rows for ages of 2 years and above.
  # Anything beyond these (e.g. growth velocity) is not implemented yet; do
  # not assume such a function exists.

key_files:
  - path: R/data.R and data/
    note: Bundled WHO and CDC reference tables (e.g. who_wt_for_age_boys,
      cdc_htage) and the adsl_peds example dataset. Document any new
      dataset in R/data.R.
  - path: R/global.R
    note: Global variable declarations (resolves R CMD check "no visible
      binding" notes).
  - path: inst/templates/ad_advs.R
    note: ADVS template script. Update it, and vignettes/advs.Rmd, when a
      derivation's usage changes.

dependencies: >
  Imports are admiral, admiraldev, cli, dplyr, magrittr, purrr, rlang,
  tidyselect and zoo (na.locf is used in interpolation). pharmaversesdtm is
  Suggests only (examples, vignettes, tests). Packages under
  related_packages other than admiral and admiraldev are NOT dependencies.

related_packages:
  # Only admiral and admiraldev are dependencies; the rest are context.
  - name: admiral
    role: Core package this extends; admiralpeds functions follow admiral's
      naming conventions (derive_param_*, derive_vars_*, compute_*) and
      depend on admiral being loaded first.
  - name: admiraldev
    role: Source of shared programming strategy, git usage, R CMD check, and
      unit test guidance synced into this package's AGENTS.md files.
  - name: pharmaversesdtm
    role: Canonical source of test SDTM data used in admiralpeds examples,
      vignettes, and unit tests.
  - name: admiralonco
    role: (Reference only) Sibling {admiral} extension package (oncology);
      useful reference for how therapeutic-area extension packages are
      structured.
  - name: admiralvaccine
    role: (Reference only) Sibling {admiral} extension package (vaccines);
      another reference implementation for extension-package conventions.
  - name: metacore
    role: (Reference only, not a dependency) Spec-driven metadata package
      that can drive variable derivation and control terminology checks
      upstream of admiralpeds derivations.
  - name: xportr
    role: (Reference only, not a dependency) Downstream package used to turn
      finished ADaM datasets (including those built with admiralpeds) into
      submission-ready XPT transport files.

cdisc_igs:
  - name: ADaM Implementation Guide (ADaMIG)
    relevance: All admiralpeds derivations follow ADaMIG conventions for
      variable naming, flag values, and dataset structure, same as admiral.
      The shipped template targets ADVS (BDS structure).
  - name: WHO Child Growth Standards / CDC Growth Charts
    relevance: Reference growth-chart data (e.g. weight-for-age,
      height-for-age, BMI-for-age) used to derive pediatric z-scores and
      percentiles — the core anthropometric use case for this package.

pediatric_specific_conventions:
  - Age is frequently required in multiple units (days, months, years) for
    matching subjects against age-banded growth-standard reference tables —
    prefer admiral's compute_age_years()/derive_vars_dy()-style helpers over
    ad hoc date arithmetic.
  - Growth z-scores/percentiles are computed against external reference
    standard tables (WHO/CDC); custom references, including
    company-specific or user-defined reference tables, may also be used.
    Derivations should keep the reference table and the interpolation logic
    clearly separated and documented.
  - CDC chart rows are interpolated by age in days for ages >= 2 years (see
    derive_interp_records()). Keep any WHO vs CDC / age-range distinction
    explicit in new derivations.
